name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Evidence, links and archived tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.5'
          python-version: '3.14'
      - name: Verify provenance hashes, local links and archived tables
        run: uv run --no-project python scripts/check_repo.py

  examples:
    name: Examples on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Run the cohort join example
        run: uv run --locked python examples/cohort_join.py
      - name: Lint the notebook
        run: uv run --locked --group notebook marimo check examples/reader_checks.py
      - name: Run the notebook as a script
        # Part 1 must match its reference. Part 2 reads a public Zenodo file and records
        # reader failures as observations, so network problems there do not fail this step.
        run: uv run --locked --group notebook python examples/reader_checks.py
