name: Public release check

# Re-reads the public PPDS v1.0.0 record weekly and fails when any reader outcome
# differs from evidence/observations/public_release_check.json. A failure means the
# readers or the host changed, and the case study may need updating.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.13.5'
          python-version: '3.14'
          enable-cache: true
      - name: Read the public record without credentials
        run: uv run --locked python evidence/methods/public_release_check.py "$RUNNER_TEMP/public_release_check.json"
      - name: Compare outcomes with the archived observation
        run: uv run --no-project python scripts/compare_public_check.py evidence/observations/public_release_check.json "$RUNNER_TEMP/public_release_check.json"
      - name: Keep the new observation
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: public-release-check
          path: ${{ runner.temp }}/public_release_check.json
          if-no-files-found: ignore
